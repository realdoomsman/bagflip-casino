<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="25%" style="stop-color:#f7b32b"/>
      <stop offset="50%" style="stop-color:#e5a320"/>
      <stop offset="75%" style="stop-color:#c4891f"/>
      <stop offset="100%" style="stop-color:#a06b15"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.6)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main coin -->
  <circle cx="100" cy="100" r="90" fill="url(#coinGrad)" stroke="#c4891f" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#c4891f" stroke-width="3" opacity="0.5"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#c4891f" stroke-width="2" opacity="0.4"/>
  
  <!-- Dollar sign / B for BAG -->
  <text x="100" y="125" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="#c4891f" opacity="0.7">B</text>
  
  <!-- Shine effect -->
  <ellipse cx="70" cy="60" rx="30" ry="20" fill="url(#shineGrad)" transform="rotate(-30 70 60)"/>
</svg>
